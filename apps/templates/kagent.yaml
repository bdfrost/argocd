apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  source:
    path: charts/kagent
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision:  {{ .Values.spec.source.targetRevision }}
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: kagent
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    # kagent 0.9.x CRDs exceed the 256KB last-applied-configuration
    # annotation limit; client-side apply fails (same reason loki/kps
    # use this option).
    - ServerSideApply=true
    managedNamespaceMetadata:
