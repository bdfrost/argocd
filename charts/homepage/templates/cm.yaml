apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: true
    gateway: true
  settings.yaml: |
    title: Frost Homelab
    headerStyle: boxedWidgets
    statusStyle: dot
    background:
      image: images/homepage.png
      brightness: 50
      opacity: 25
      blur: sm
      saturate: 90
    cardBlur: sm
    hideErrors: false
    logo: logo.png
    favicon: favicon.png
    theme: dark
    color: slate
    showThemeToggle: true
    defaultWidgetView: grid
    layout:
      Media & Entertainment:
        style: row
        columns: 4
        header: true
        icon: mdi-filmstrip
      Media Management:
        style: row
        columns: 4
        header: true
        icon: mdi-cog
      AI:
        style: row
        columns: 3
        header: true
        icon: mdi-robot-outline
      Apps:
        style: row
        columns: 3
        header: true
        icon: mdi-apps
      Home:
        style: row
        columns: 3
        header: true
        icon: mdi-home-automation
      Infrastructure:
        style: row
        columns: 4
        header: true
        icon: mdi-server-network
      Monitoring & Observability:
        style: row
        columns: 4
        header: true
        icon: mdi-chart-line
      Proxmox & Cluster:
        style: row
        columns: 4
        header: true
        icon: mdi-server
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
      showSearchSuggestions: true
      hideVisitURL: false
  custom.css: |
    /* Service + bookmark cards */
    li.service,
    li.bookmark {
      border-radius: 0.75rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    li.service:hover,
    li.bookmark:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    /* Group headers */
    h2.service-group-name,
    h2.bookmark-group-name {
      letter-spacing: 0.03em;
    }

    /* Softer status dots */
    .status-dot {
      box-shadow: 0 0 6px currentColor;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Quick Access:
      - Plex:
        - icon: plex.png
          href: https://peppers.frost.haus
          description: Media server
      - Home Assistant:
        - icon: home-assistant.png
          href: http://homeassistant.frost.haus:8123
          description: Home automation
    - Documentation:
      - Kubernetes Docs:
        - icon: kubernetes.png
          href: https://kubernetes.io/docs/
          description: Kubernetes documentation
      - ArgoCD Docs:
        - icon: argo-cd.png
          href: https://argo-cd.readthedocs.io/
          description: ArgoCD documentation
      - Proxmox Docs:
        - icon: proxmox.png
          href: https://pve.proxmox.com/wiki/
          description: Proxmox wiki & docs
      - Homepage Docs:
        - icon: homepage.png
          href: https://gethomepage.dev/
          description: Homepage configuration docs
    - Development:
      - GitHub:
        - icon: github.png
          href: https://github.com/
          description: Code repositories
      - Docker Hub:
        - icon: docker.png
          href: https://hub.docker.com/
          description: Container images
    - Entertainment:
      - YouTube:
        - icon: youtube.png
          href: https://youtube.com/
          description: Video streaming
      - Reddit:
        - icon: reddit.png
          href: https://reddit.com/
          description: Social news aggregation
  services.yaml: |
    - Media & Entertainment:
        - Immich:
            icon: mdi-image-multiple
            href: https://immich.frost.haus
            description: Self-hosted photo & video library
        - Plex:
            icon: plex.png
            href: https://peppers.frost.haus
            description: Media streaming server
            widgets:
              - type: plex
                url: https://peppers.frost.haus
                key: "{{ "{{" }}HOMEPAGE_VAR_PLEX_APIKEY{{ "}}" }}"
        - Tracearr:
            icon: tracearr.png
            href: https://tracearr.frost.haus
            description: Plex stream monitoring
            widget:
              type: tracearr
              url: https://tracearr.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_TRACEARR_APIKEY{{ "}}" }}"
              enableUser: true
              showEpisodeNumber: true
              expandOneStreamToTwoRows: false
        - Seerr:
            icon: overseerr.png
            href: https://seerr.frost.haus
            description: Media request management
            widget:
              type: seerr
              url: https://seerr.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_OVERSEERR_APIKEY{{ "}}" }}"
              fields: ["pending", "approved", "completed"]
        - Sonarr:
            icon: sonarr.png
            href: https://sonarr.frost.haus
            description: TV show management
            widget:
              type: sonarr
              url: https://sonarr.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_SONARR_APIKEY{{ "}}" }}"
        - Radarr:
            icon: radarr.png
            href: https://radarr.frost.haus
            description: Movie management
            widget:
              type: radarr
              url: https://radarr.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_RADARR_APIKEY{{ "}}" }}"
        - Prowlarr:
            icon: prowlarr.png
            href: https://prowlarr.frost.haus
            description: Indexer management
            widget:
              type: prowlarr
              url: https://prowlarr.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_PROWLARR_APIKEY{{ "}}" }}"
        - Bazarr:
            icon: bazarr.png
            href: https://bazarr.frost.haus
            description: Subtitle management
            widget:
              type: bazarr
              url: https://bazarr.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_BAZARR_APIKEY{{ "}}" }}"
        - Sabnzbd:
            icon: sabnzbd.png
            href: https://sabnzbd.frost.haus
            description: Usenet downloader
            widget:
              type: sabnzbd
              url: https://sabnzbd.frost.haus
              key: "{{ "{{" }}HOMEPAGE_VAR_SABNZBD_APIKEY{{ "}}" }}"
    - Media Management:
        - Calendar:
            icon: mdi-calendar
            description: Upcoming media releases
            widget:
              type: calendar
              firstDayInWeek: sunday
              view: agenda
              maxEvents: 10
              showTime: true
              timezone: America/Chicago
              integrations:
                - type: sonarr
                  service_group: Media & Entertainment
                  service_name: Sonarr
                  color: teal
                  baseUrl: https://sonarr.frost.haus
                  params:
                    unmonitored: true
                - type: radarr
                  service_group: Media & Entertainment
                  service_name: Radarr
                  color: orange
                  baseUrl: https://radarr.frost.haus
                  params:
                    unmonitored: true
        - Agregarr:
            icon: agregarr.png
            href: https://agregarr.frost.haus
            description: Bulk add media to Arr apps
        - Chaptarr:
            icon: mdi-book-open-page-variant
            href: https://chaptarr.frost.haus
            description: eBook and audiobook collection manager
        - Livrarr:
            icon: mdi-bookshelf
            href: https://livrarr.frost.haus
            description: Book & reading management
        - Cleanuparr:
            icon: mdi-broom
            href: https://cleanuparr.frost.haus
            description: Cleanup media in Arr apps
        - Maintainerr:
            icon: mdi-wrench
            href: https://maintainerr.frost.haus
            description: Automated Plex library maintenance
    - AI:
        - Open WebUI:
            icon: open-webui.png
            href: https://open-webui.frost.haus
            description: Local LLM interface
        - Ollama:
            icon: ollama.png
            href: https://ollama.frost.haus
            description: Local model runtime
            widget:
              type: ollama
              url: https://ollama.frost.haus
        - kagent:
            icon: mdi-robot-outline
            href: https://kagent-ui.frost.haus
            description: Kubernetes agent framework UI
    - Apps:
        - Poterie:
            icon: mdi-flower-outline
            href: https://poterie.frost.haus
            description: Garden planner
        - SimpleFin:
            icon: mdi-cash-multiple
            href: https://simplefin.frost.haus
            description: Personal finance
    - Home:
        - Home Assistant:
            icon: home-assistant.png
            href: http://homeassistant.frost.haus:8123
            description: Home automation
        - BirdNET-Go:
            icon: mdi-bird
            href: https://birdnet-go.frost.haus
            description: Birdsong detection & logging
    - Infrastructure:
        - Argo CD:
            icon: argo-cd.png
            href: https://argocd.frost.haus
            description: GitOps continuous delivery
            widget:
              type: argocd
              url: https://argocd.frost.haus/
              key: "{{ "{{" }}HOMEPAGE_VAR_ARGOCD_APIKEY{{ "}}" }}"
              fields: ["apps", "synced", "outOfSync", "healthy"]
        - Skooner:
            icon: kubernetes.png
            href: https://skooner.frost.haus
            description: Kubernetes dashboard
        - Prometheus:
            icon: prometheus.png
            href: https://prometheus.frost.haus
            description: Metrics collection & alerting
            widget:
              type: prometheus
              url: https://prometheus.frost.haus
        - Grafana:
            icon: grafana.png
            href: https://grafana.frost.haus
            description: Metrics visualization
        - Alertmanager:
            icon: mdi-alert-circle
            href: https://alertmanager.frost.haus
            description: Alert management & routing
    - Monitoring & Observability:
        - Uptime Kuma:
            icon: mdi-bell
            href: https://uptime-kuma.frost.haus
            description: Uptime monitoring & alerts
            widget:
              type: uptimekuma
              url: https://uptime-kuma.frost.haus/
              slug: default
        - changedetection.io:
            icon: mdi-web
            href: https://changedetection.frost.haus
            description: Website change detection and notifications
        - Speedtest Tracker:
            icon: mdi-speedometer
            href: https://speedtest-tracker.frost.haus
            description: Internet speed history & trends
        - Dozzle:
            icon: dozzle.png
            href: https://dozzle.frost.haus
            description: Live container log viewer
    - Proxmox & Cluster:
        - Proxmox VE:
            icon: proxmox.png
            href: https://pve1.frost.haus:8006
            description: Virtualization platform
            ping: https://pve1.frost.haus:8006
            widget:
              type: proxmox
              url: https://pve1.frost.haus:8006
              username: root@pam!homepage.io
              password: "{{ "{{" }}HOMEPAGE_VAR_PVE_APIKEY{{ "}}" }}"
              fields: ["vms", "lxc"]
        - Proxmox Backup Server:
            icon: proxmox.png
            href: https://pbs.frost.haus:8007
            description: Backup solution
            ping: https://pbs.frost.haus:8007
            widget:
              type: proxmoxbackupserver
              url: https://pbs.frost.haus:8007
              username: root@pam!homepage.io
              password: "{{ "{{" }}HOMEPAGE_VAR_PBS_APIKEY{{ "}}" }}"
              fields: ["datastore_usage", "failed_tasks_24h", "cpu_usage", "memory_usage"]
        - K8s-c1:
            icon: kubernetes.png
            description: Control plane · 192.168.100.175
            ping: https://192.168.100.175:10250
        - K8s-n1:
            icon: kubernetes.png
            description: Worker node · 192.168.100.137
            ping: https://192.168.100.137:10250
        - K8s-n2:
            icon: kubernetes.png
            description: Worker node · 192.168.100.156
            ping: https://192.168.100.156:10250
        - K8s-n3:
            icon: kubernetes.png
            description: Worker node · 192.168.100.145
            ping: https://192.168.100.145:10250
  widgets.yaml: |
    - logo:
        icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/homepage.png
    - greeting:
        text_size: xl
        text: "Welcome to Frost Homelab"
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - search:
        provider: duckduckgo
        target: _blank
        focus: false
    - openmeteo:
        label: Oklahoma City
        latitude: 35.4676
        longitude: -97.5164
        timezone: America/Chicago
        units: imperial
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
  docker.yaml: ""
  proxmox.yaml: |
    - HomeAssistant:
      icon: home-assistant.png
      href: http://homeassistant.frost.haus:8123/
      description: Home automation
      proxmoxNode: pve2.frost.haus
      proxmoxVMID: 100
    - K8s-n1:
      icon: kubernetes.png
      description: K8s Node 1
      proxmoxNode: pve1.frost.haus
      proxmoxVMID: 107
    - K8s-n2:
      icon: kubernetes.png
      description: K8s Node 2
      proxmoxNode: pve2.frost.haus
      proxmoxVMID: 104
    - K8s-n3:
      icon: kubernetes.png
      description: K8s Node 3
      proxmoxNode: pve3.frost.haus
      proxmoxVMID: 103
    - K8s-c1:
      icon: kubernetes.png
      description: K8s Controller Node
      proxmoxNode: pve3.frost.haus
      proxmoxVMID: 106
