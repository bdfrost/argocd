name: zigbee2mqtt
# Frontend port, as set in configuration.yaml on the data volume.
targetPort: 8099

# Only one: the SLZB-06 coordinator takes one Zigbee2MQTT connection at a time.
replicas: 1

image:
  repository: koenkk/zigbee2mqtt
  # Matches the add-on it replaces. Bump separately once it runs here.
  tag: "2.14.3"
  pullPolicy: IfNotPresent
