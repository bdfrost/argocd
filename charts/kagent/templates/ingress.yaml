apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    external-dns.alpha.kubernetes.io/host: {{ .Values.name }}-ui.frost.haus
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - {{ .Values.name }}-ui.frost.haus
    secretName: {{ .Values.name }}-ui-cert
  rules:
  - host: {{ .Values.name }}-ui.frost.haus
    http:
      paths:
      - pathType: ImplementationSpecific
        path: "/"
        backend:
          service:
            # 0.9.x split the 0.4.0 monolith pod into per-component services;
            # the UI is now served by kagent-ui (port name: ui).
            name: {{ .Values.name }}-ui
            port:
              name: ui
