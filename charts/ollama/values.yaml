replicaCount: 1
name: ollama
targetPort: 11434
puid: 1026
pgid: 100

ollama:
  # tolerations:
  #   - key: nvidia.com/gpu
  #     operator: Exists
  #     effect: NoSchedule
  resources:
    requests:
      # Reserve what a Frigate GenAI review actually uses (~7.7Gi peak). A 2Gi
      # request let the scheduler overcommit k8s-n2 (limits at 122% of its
      # 16Gi), and on 2026-11-25 ollama grew to 8.8Gi alongside plex and the
      # node ran out of memory and hung instead of OOM-killing anything.
      memory: "8Gi"
      cpu: "2"
    limits:
      # Frigate's GenAI review requests (num_ctx 16384, several recording
      # frames) peak ~7.7Gi. 10Gi leaves headroom for that while staying low
      # enough that the cgroup OOM-kills ollama before the node runs out.
      memory: "10Gi"
  extraEnv:
    # One model resident at a time, unloaded soon after use, so two models
    # (e.g. Frigate's vision model plus a chat model) can't stack in RAM.
    - name: OLLAMA_MAX_LOADED_MODELS
      value: "1"
    - name: OLLAMA_KEEP_ALIVE
      value: "2m"
  runtimeClassName: nvidia
  ollama:
    gpu:
      enabled: true
      type: 'nvidia'
      number: 1
      nvidiaResource: "nvidia.com/gpu"
    models:
      pull:
        - qwen3.5:4b
        - llama3.2
        - qwen3-vl:4b-instruct
  service:
    type: ClusterIP
    port: 11434
    nodePort: 31434
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/host: ollama.frost.haus
      nginx.ingress.kubernetes.io/proxy-body-size: 200m
    hosts:
      - host: ollama.frost.haus
        paths:
        - pathType: ImplementationSpecific
          path: "/"
          backend:
            service:
              name: ollama
              port:
                name: http
    tls:
      - hosts:
        - ollama.frost.haus
        secretName: ollama-cert
  persistentVolume:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 64Gi
    storageClass: "synology-csi-iscsi-delete"