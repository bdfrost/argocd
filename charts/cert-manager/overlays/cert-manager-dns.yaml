apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  template:
    spec:
      containers:
        - name: cert-manager
          args:
            - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
            - --dns01-recursive-nameservers-only
