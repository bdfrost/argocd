# Grafana sidecar picks this up (label grafana_dashboard=1), same pattern as charts/loki's datasource ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: synology-correlation-dashboard
  namespace: kube-prometheus-stack
  labels:
    grafana_dashboard: '1'
data:
  synology-correlation.json: "{\n  \"uid\": \"synology-correlation\",\n  \"title\": \"Synology correlation\",\n  \"tags\": [\n    \"synology\",\n    \"storage\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"graphTooltip\": 1,\n  \"refresh\": \"1m\",\n  \"time\": {\n    \"from\": \"now-12h\",\n    \"to\": \"now\"\n  },\n  \"annotations\": {\n    \"list\": [\n      {\n        \"name\": \"NAS jobs\",\n        \"datasource\": {\n          \"type\": \"loki\",\n          \"uid\": \"loki\"\n        },\n        \"enable\": true,\n        \"iconColor\": \"orange\",\n        \"expr\": \"{job=\\\"synology\\\"} |~ \\\"(?i)scrub|snapshot|backup|replicat|task|cache|start|finish|complet\\\"\",\n        \"titleFormat\": \"{{app}}\",\n        \"textFormat\": \"\",\n        \"tagKeys\": \"app\"\n      },\n      {\n        \"name\": \"Pod restarts\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"prometheus\"\n        },\n        \"enable\": true,\n\
    \        \"iconColor\": \"red\",\n        \"expr\": \"sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[2m])) > 0\",\n        \"step\": \"2m\",\n        \"titleFormat\": \"restart\",\n        \"textFormat\": \"{{namespace}}/{{pod}}\",\n        \"tagKeys\": \"namespace\"\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"NAS CPU\",\n      \"description\": \"CPU busy and time spent waiting on disk, from SNMP.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\"\
    : []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"cpuUtilization{job=\\\"synology\\\"}\",\n          \"legendFormat\": \"CPU %\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"100 * sum(rate(ssCpuRawWait{job=\\\"synology\\\"}[2m])) / sum(rate({__name__=~\\\"ssCpuRaw(User|Nice|System|Idle|Wait|Kernel|Interrupt|SoftIRQ)\\\",job=\\\"synology\\\"}[2m]))\",\n          \"legendFormat\": \"I/O wait %\"\n        }\n      ]\n    },\n    {\n      \"\
    type\": \"timeseries\",\n      \"title\": \"NAS disk load per drive\",\n      \"description\": \"How busy each physical drive is (Synology storageIO load).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"\
    datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"storageIOLA{job=\\\"synology\\\"}\",\n          \"legendFormat\": \"{{storageIODevice}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"NAS disk throughput\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Bps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\
    \n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(rate(storageIONWrittenX{job=\\\"synology\\\"}[2m]))\",\n          \"legendFormat\": \"write\"\n        },\n        {\n          \"refId\": \"B\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"sum(rate(storageIONReadX{job=\\\"synology\\\"}[2m]))\",\n          \"legendFormat\": \"read\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"iSCSI LUN write latency (top 8)\",\n      \"description\": \"Per-LUN disk write latency as DSM reports it (Synology's MIB doesn't state the unit; compare shapes, not absolute values). LUN names match\
    \ the pvc-... volumes.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"topk(8,\
    \ iSCSILUNDiskLatencyWrite{job=\\\"synology\\\"} * on(iSCSILUNInfoIndex) group_left(iSCSILUNName) iSCSILUNName{job=\\\"synology\\\"})\",\n          \"legendFormat\": \"{{iSCSILUNName}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Proxmox VM disk writes (top 5)\",\n      \"description\": \"Which VMs are writing hardest. k8s-c1 is qemu/106.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Bps\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n  \
    \        \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"topk(5, max by (id) (rate(pve_disk_write_bytes{id=~\\\"qemu/.*\\\"}[5m])) * on(id) group_left(name) max by (id, name) (pve_guest_info))\",\n          \"legendFormat\": \"{{name}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"etcd slow-disk warnings (k8s-c1 log)\",\n      \"description\": \"Needs Alloy running on k8s-c1 (toleration added in charts/loki).\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"\
    defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"drawStyle\": \"bars\",\n            \"fillOpacity\": 60,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"sum(count_over_time({namespace=\\\"kube-system\\\", pod=\\\"etcd-k8s-c1\\\"} |~ \\\"slow fdatasync|took too long\\\" [5m]))\",\n          \"legendFormat\": \"warnings / 5m\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Pod restarts by namespace\",\n\
    \      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 24\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"drawStyle\": \"bars\",\n            \"fillOpacity\": 60,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"\
    sum by (namespace) (increase(kube_pod_container_status_restarts_total[5m])) > 0\",\n          \"legendFormat\": \"{{namespace}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"NAS memory\",\n      \"description\": \"\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 24\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"custom\": {\n            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n            \"lineWidth\": 1,\n            \"showPoints\": \"never\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"legend\": {\n          \"displayMode\": \"list\",\n          \"placement\": \"bottom\"\n        },\n        \"tooltip\": {\n          \"mode\": \"multi\",\n          \"sort\":\
    \ \"desc\"\n        }\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"memUtilization{job=\\\"synology\\\"}\",\n          \"legendFormat\": \"memory %\"\n        }\n      ]\n    },\n    {\n      \"type\": \"logs\",\n      \"title\": \"NAS log (DSM Log Center)\",\n      \"datasource\": {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"gridPos\": {\n        \"h\": 12,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 32\n      },\n      \"options\": {\n        \"showTime\": true,\n        \"wrapLogMessage\": true,\n        \"sortOrder\": \"Descending\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\": \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\": \"{job=\\\"synology\\\"}\"\n        }\n    \
    \  ]\n    }\n  ]\n}"

