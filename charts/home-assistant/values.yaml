name: home-assistant
targetPort: 8123

# Stays 0 until cutover: the HAOS VM still runs, and the config volume gets
# the VM's restored backup first.
replicas: 0

image:
  repository: ghcr.io/home-assistant/home-assistant
  # Matches the HAOS VM it replaces, so the restored config needs no upgrade.
  tag: "2026.11.3"
  pullPolicy: IfNotPresent

# Clients reach Home Assistant at homeassistant.frost.haus:8123 (Music
# Assistant, Homepage, Uptime Kuma, Cast/Nest speakers fetching TTS, phones and
# browsers). external-dns points that name at this address.
loadBalancerIP: 192.168.100.60
# Off until cutover. The name is still a DHCP-made record for the HAOS VM, and
# external-dns won't take over a record it doesn't own, so that record goes
# first.
announceLoadBalancerIP: false
