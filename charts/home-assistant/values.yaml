name: home-assistant
targetPort: 8123

# Only one: a single config volume and recorder database.
replicas: 1

image:
  repository: ghcr.io/home-assistant/home-assistant
  # Matches the HAOS VM it replaces, so the restored config needs no upgrade.
  tag: "2026.11.3"
  pullPolicy: IfNotPresent

# Clients reach Home Assistant at homeassistant.frost.haus:8123 (Music
# Assistant, Homepage, Uptime Kuma, Cast/Nest speakers fetching TTS, phones and
# browsers). external-dns points that name at this address.
loadBalancerIP: 192.168.100.60
# Gates the LoadBalancer service. It was off while the HAOS VM held the name.
announceLoadBalancerIP: true
