# For the HTTPS ingress (ha.frost.haus).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
  - name: http
    port: 80
    targetPort: {{ .Values.targetPort }}
    protocol: TCP
{{- if .Values.announceLoadBalancerIP }}
---
# homeassistant.frost.haus:8123, the address every client uses.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-lb
  labels:
    app: {{ .Values.name }}
  annotations:
    # external-dns publishes this name in Technitium for the LoadBalancer IP.
    external-dns.kubernetes.io/hostname: homeassistant.frost.haus
    metallb.universe.tf/loadBalancerIPs: {{ .Values.loadBalancerIP }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.name }}
  ports:
  - name: http
    port: 8123
    targetPort: {{ .Values.targetPort }}
    protocol: TCP
{{- end }}
