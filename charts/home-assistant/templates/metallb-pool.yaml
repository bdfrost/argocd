# A one-address pool for Home Assistant's address, which sits inside the DHCP
# range rather than first-pool. autoAssign is off so nothing else can take it.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: home-assistant
  namespace: metallb-system
spec:
  addresses:
  - {{ .Values.loadBalancerIP }}/32
  autoAssign: false
---
# The existing L2Advertisement only covers first-pool.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: home-assistant
  namespace: metallb-system
spec:
  ipAddressPools:
  - home-assistant
