# Static NFS PV + claim for the Immich library.
# storageClassName: "" opts out of dynamic provisioning (Synology CSI would
# otherwise grab this claim and spin an iSCSI LUN — the >20Gi mount-deadline
# pitfall). claimRef pins the PV to our PVC only.
apiVersion: v1
kind: PersistentVolume
metadata:
  # v2: PV spec.nfs is immutable and the path was corrected in 9aad87c
  # (export root + media-location isolation). Renamed per repo convention
  # (plex-config-pvc-v5); ArgoCD prune retires the v1 pair.
  name: immich-library-pv-v2
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: library
    app.kubernetes.io/managed-by: argocd
spec:
  capacity:
    storage: {{ .Values.library.capacity }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  # no explicit vers: mirrors bazarr/plex mounts (kernel negotiates; DSM
  # rejects some sub-path/version combos clients can't see coming)
  nfs:
    server: {{ .Values.library.nfs.server }}
    path: {{ .Values.library.nfs.path }}
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: {{ .Release.Namespace }}
    name: immich-library-pvc-v2
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-pvc-v2
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: library
    app.kubernetes.io/managed-by: argocd
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: {{ .Values.library.capacity }}
