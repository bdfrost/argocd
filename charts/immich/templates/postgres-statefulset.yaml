{{- if .Values.database.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/component: postgresql
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: immich-database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/component: postgresql
    spec:
      # official postgres images ship no USER directive (root entrypoint gosu-drops
      # to uid 70), so runAsNonRoot must not be set; fsGroup 70 suffices
      securityContext:
        fsGroup: 70
      terminationGracePeriodSeconds: 60
      initContainers:
        # The first initdb pass was interrupted after --username created the
        # immich ROLE but before the entrypoint's CREATE DATABASE, and a
        # non-empty PGDATA makes the entrypoint skip that step forever.
        # Single-user mode runs CREATE DATABASE directly against the datadir
        # before the server starts. fsGroup lands 0770+setgid on the volume,
        # which postgres rejects ("invalid permissions"), so normalize
        # owner/mode first; errors swallowed -> idempotent no-op on restarts.
        - name: ensure-immich-database
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              chown postgres:postgres /var/lib/postgresql/data/pgdata 2>/dev/null || true
              chmod 0750 /var/lib/postgresql/data/pgdata 2>/dev/null || true
              su postgres -c "echo 'CREATE DATABASE {{ .Values.database.auth.database }} OWNER {{ .Values.database.auth.username }};' | postgres --single -D /var/lib/postgresql/data/pgdata template1" 2>&1 || echo "immich db init skipped (normally: already exists)"
          {{- with .Values.database.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgresql
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          args:
            - postgres
            {{- range .Values.database.postgresArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.database.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: "America/Chicago"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.auth.username | quote }}, "-d", {{ .Values.database.auth.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.auth.username | quote }}, "-d", {{ .Values.database.auth.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.database.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
            - name: hba
              mountPath: /config/pg_hba.conf
              subPath: pg_hba.conf
              readOnly: true
      volumes:
        - name: hba
          configMap:
            name: immich-pg-hba
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.database.shmSize }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: immich
          app.kubernetes.io/component: postgresql
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.database.persistence.storageClass }}
        storageClassName: {{ .Values.database.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.persistence.size }}
{{- end }}
