# Sidekiq queue + Rails cache. emptyDir like immich's valkey: queued jobs are
# lost on a restart, but scheduled jobs are re-enqueued by sidekiq-cron and
# imports can be re-run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-redis
  labels:
    app: {{ .Values.name }}-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}-redis
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-redis
  labels:
    app: {{ .Values.name }}-redis
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
