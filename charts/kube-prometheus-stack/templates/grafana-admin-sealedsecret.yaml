# Grafana admin login, read through grafana.admin.existingSecret in values.yaml.
# admin-password is sealed (scripts/generate-secret.sh); admin-user is not secret.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: grafana-admin
  namespace: kube-prometheus-stack
spec:
  encryptedData:
    admin-password: SEALED_GRAFANA_ADMIN_PASSWORD
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: grafana-admin
      namespace: kube-prometheus-stack
    data:
      admin-user: admin
