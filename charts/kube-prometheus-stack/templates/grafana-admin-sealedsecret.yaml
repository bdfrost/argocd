# Grafana admin credentials. Chart 93.x no longer defaults adminPassword and renders a fresh
# random one on every Argo render, which would rotate this Secret (and restart Grafana via its
# checksum annotation) on every commit. Grafana only reads it when creating grafana.db, so it
# holds the password the existing DB already uses. Rotate both together.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  name: grafana-admin
  namespace: kube-prometheus-stack
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/cluster-wide: "true"
      name: grafana-admin
      namespace: kube-prometheus-stack
