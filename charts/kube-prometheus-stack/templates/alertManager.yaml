apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanagerconfig
  namespace: kube-prometheus-stack
  labels:
    alertmanagerConfig: global
spec:
  route:
    receiver: slack
    routes:
    # Watchdog always fires (dead-man's switch) and InfoInhibitor only feeds inhibition;
    # without this they'd post to Slack every repeat_interval forever
    - receiver: "null"
      matchers:
      - name: alertname
        matchType: "=~"
        value: "Watchdog|InfoInhibitor"
  receivers:
  - name: "null"
  - name: slack
    slackConfigs:
    - channel: '#general'
      apiURL:
        name: alertmanager-secrets
        key: slack_api_url
      sendResolved: true
      title: "{{`{{ range .Alerts }}`}}{{`{{ .Annotations.summary }}`}}\n{{`{{ end }}`}}"
      text: "{{`{{ range .Alerts }}`}}{{`{{ .Annotations.description }}`}}\n{{`{{ end }}`}}"
