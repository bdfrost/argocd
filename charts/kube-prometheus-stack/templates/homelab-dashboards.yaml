# One ConfigMap per file in dashboards/. Grafana's sidecar loads anything labelled
# grafana_dashboard=1 and files it under the folder named in grafana_folder.
# .Files.Get is not run through the template engine, so the dashboards' own legend
# placeholders reach Grafana untouched. Edit the JSON (or export from Grafana) and commit.
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ base $path | trimSuffix ".json" }}-dashboard
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Homelab
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
