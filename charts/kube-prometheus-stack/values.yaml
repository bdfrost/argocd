name: kube-prometheus-stack
kube-prometheus-stack:
  alertmanager:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/host: alertmanager.frost.haus
      hosts:
        - alertmanager.frost.haus
      tls:   
      - hosts:
        - alertmanager.frost.haus
        secretName: alertmanager-cert
    alertmanagerSpec:
      configSecret: alertmanager-secrets
      # by default the operator scopes an AlertmanagerConfig's route to its own namespace,
      # which would drop every cluster alert outside kube-prometheus-stack
      alertmanagerConfigMatcherStrategy:
        type: None
      resources:
        requests:
          memory: 64Mi
      # without a PVC the operator uses an emptyDir, so silences vanish on every restart
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: synology-csi-iscsi-retain
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
  grafana:
    # From templates/grafana-admin-sealedsecret.yaml. Without it the chart renders a random
    # password on every render, so the Secret (and Grafana) would churn on every commit.
    admin:
      existingSecret: grafana-admin
    # The sidecars read the admin login from grafana-admin as env vars at startup, so restart
    # the pod when that Secret is rotated or their reload calls start failing with 401.
    podAnnotations:
      reloader.stakater.com/auto: "true"
    # keep UI-created dashboards/users across restarts (default is an emptyDir)
    persistence:
      enabled: true
      storageClassName: synology-csi-iscsi-delete
      size: 2Gi
    # RWO volume: stop the old pod before starting the new one so it can't wait on the old mount.
    # Not type: Recreate, because the live Deployment keeps its defaulted rollingUpdate block and
    # the apiserver rejects that combination on sync.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    # Lets a dashboard ConfigMap pick its folder with a grafana_folder annotation
    # (templates/homelab-dashboards.yaml uses "Homelab"). Unannotated ones stay in General.
    sidecar:
      dashboards:
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/host: kube-prometheus-stack.frost.haus
      hosts:
        - grafana.frost.haus
      tls:   
      - hosts:
        - grafana.frost.haus
        secretName: grafana-cert
  prometheus:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/host: prometheus.frost.haus
      hosts:
        - prometheus.frost.haus
      tls:   
      - hosts:
        - prometheus.frost.haus
        secretName: prometheus-cert
    prometheusSpec:
      resources:
        requests:
          memory: 1Gi
      # without storageSpec the operator uses an emptyDir and the TSDB is lost on every restart.
      # ~5k samples/s * 10d is ~7GB; retentionSize trims old blocks before the volume fills.
      # retain class so deleting the app doesn't take the history with it.
      retention: 10d
      retentionSize: 16GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: synology-csi-iscsi-retain
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      # By default the operator only reads ServiceMonitors/PodMonitors labelled
      # release=kube-prometheus-stack, so every other chart's monitor (grafana, loki, immich,
      # argocd, the arr exporters...) was silently ignored. Read them from every namespace.
      # PrometheusRules still need the release label (ruleSelector is unchanged).
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      # The sonarr/radarr/prowlarr/sabnzbd exporters used to be static jobs here because their
      # ServiceMonitors weren't picked up. They are now, so the static jobs are gone (they'd
      # scrape everything twice).
      additionalScrapeConfigs:
        - job_name: 'pve'
          static_configs:
            - targets:
              - pve1.frost.haus
              - pve2.frost.haus
              - pve3.frost.haus          
          metrics_path: /pve
          params:
            module: [default]
            cluster: ['1']
            node: ['1']
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: prometheus-pve-exporter.frost.haus:9221
        # Synology super-duke over SNMP, via the exporter in charts/synology-monitoring.
        # 60s keeps the SNMP walk light on the NAS's CPU. Community lives in that chart's SealedSecret.
        - job_name: 'synology'
          scrape_interval: 60s
          scrape_timeout: 50s
          metrics_path: /snmp
          params:
            module: [synology, ucd_system_stats, ucd_memory]
            auth: [synology_v2]
          static_configs:
            - targets: ['192.168.100.250']
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - target_label: instance
              replacement: super-duke
            - target_label: __address__
              replacement: snmp-exporter.synology-monitoring.svc.cluster.local:9116
  # Every node is Linux; the AIX and macOS node-exporter dashboards were empty clutter.
  nodeExporter:
    operatingSystems:
      aix:
        enabled: false
      darwin:
        enabled: false
