name: kube-prometheus-stack
kube-prometheus-stack:
  alertmanager:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/host: alertmanager.frost.haus
      hosts:
        - alertmanager.frost.haus
      tls:   
      - hosts:
        - alertmanager.frost.haus
        secretName: alertmanager-cert
    alertmanagerSpec:
      configSecret: alertmanager-secrets
      # by default the operator scopes an AlertmanagerConfig's route to its own namespace,
      # which would drop every cluster alert outside kube-prometheus-stack
      alertmanagerConfigMatcherStrategy:
        type: None
      resources:
        requests:
          memory: 64Mi
      # without a PVC the operator uses an emptyDir, so silences vanish on every restart
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: synology-csi-iscsi-retain
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 2Gi
  grafana:
    # keep UI-created dashboards/users across restarts (default is an emptyDir)
    persistence:
      enabled: true
      storageClassName: synology-csi-iscsi-delete
      size: 2Gi
    # RWO volume: stop the old pod before starting the new one so it can't wait on the old mount.
    # Not type: Recreate, because the live Deployment keeps its defaulted rollingUpdate block and
    # the apiserver rejects that combination on sync.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/host: kube-prometheus-stack.frost.haus
      hosts:
        - grafana.frost.haus
      tls:   
      - hosts:
        - grafana.frost.haus
        secretName: grafana-cert
  prometheus:
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        external-dns.alpha.kubernetes.io/host: prometheus.frost.haus
      hosts:
        - prometheus.frost.haus
      tls:   
      - hosts:
        - prometheus.frost.haus
        secretName: prometheus-cert
    prometheusSpec:
      resources:
        requests:
          memory: 1Gi
      # without storageSpec the operator uses an emptyDir and the TSDB is lost on every restart.
      # ~5k samples/s * 10d is ~7GB; retentionSize trims old blocks before the volume fills.
      # retain class so deleting the app doesn't take the history with it.
      retention: 10d
      retentionSize: 16GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: synology-csi-iscsi-retain
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi
      additionalScrapeConfigs:
        - job_name: "sonarr-exporter"
          static_configs:
            - targets: ["sonarr-exporter.sonarr-exporter.svc.cluster.local:9707"]
        - job_name: "radarr-exporter"
          static_configs:
            - targets: ["radarr-exporter.radarr-exporter.svc.cluster.local:9707"]
        - job_name: "prowlarr-exporter"
          static_configs:
            - targets: ["prowlarr-exporter.prowlarr-exporter.svc.cluster.local:9707"]
        - job_name: "sabnzbd-exporter"
          static_configs:
            - targets: ["sabnzbd-exporter.sabnzbd-exporter.svc.cluster.local:9707"]
        - job_name: 'pve'
          static_configs:
            - targets:
              - pve1.frost.haus
              - pve2.frost.haus
              - pve3.frost.haus          
          metrics_path: /pve
          params:
            module: [default]
            cluster: ['1']
            node: ['1']
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: prometheus-pve-exporter.frost.haus:9221