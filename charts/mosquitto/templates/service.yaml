apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
  annotations:
    # external-dns publishes this name in Technitium for the LoadBalancer IP.
    # Clients use mqtt.frost.haus, a hand-made record pointed here at cutover.
    external-dns.kubernetes.io/hostname: {{ .Values.name }}.frost.haus
    metallb.universe.tf/loadBalancerIPs: {{ .Values.loadBalancerIP }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.name }}
  ports:
  - name: mqtt
    port: 1883
    targetPort: mqtt
    protocol: TCP
