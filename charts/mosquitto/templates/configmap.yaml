apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous false
    # Copied out of the SealedSecret by the init container so it has the
    # owner and mode Mosquitto insists on.
    password_file /mosquitto/passwd/passwd

    # Retained messages carry Home Assistant's MQTT discovery configs, so
    # they must survive restarts.
    persistence true
    persistence_location /mosquitto/data/
    autosave_interval 300

    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information
    connection_messages true
    log_timestamp_format %Y-%m-%dT%H:%M:%S
