apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
---
# Home Assistant's Z-Wave integration talks to the websocket server directly.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-ws
  labels:
    app: {{ .Values.name }}
  annotations:
    # external-dns publishes this name in Technitium for the LoadBalancer IP.
    external-dns.kubernetes.io/hostname: zwave-js.frost.haus
    metallb.universe.tf/loadBalancerIPs: {{ .Values.loadBalancerIP }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Values.name }}
  ports:
  - name: ws
    port: 3000
    targetPort: ws
    protocol: TCP
