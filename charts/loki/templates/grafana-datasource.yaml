# Picked up by the kube-prometheus-stack Grafana datasource sidecar
# (label grafana_datasource=1, searchNamespace ALL by default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: kube-prometheus-stack
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-gateway.loki.svc.cluster.local
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
