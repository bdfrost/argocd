apiVersion: v1
data:
  movies.yaml: |
    templates:
      Holiday:
        smart_label: title.asc
        summary: "A timed collection of <<holiday>> movies and other movies that may relate to the holiday. NOTE: this collection will automatically disappear once the holiday period is over."
        delete_not_scheduled: true
        sort_title: '!AA'
        run_again: true
      #visible_home: true
      #visible_shared: true
        sync_mode: sync
        collection_mode: show_items
      Chart:
        sort_title: +++++_<<collection_name>>
        sync_mode: sync
        smart_label: random
        visible_home: false
        visible_shared: false
        collection_mode: show_items
      Movies:
        radarr_add_missing: false
        optional:
          - collection
          - tmdb_movie
          - tmdb_list
        # REMOVED 2026-10-08: trakt_list no longer supported
        # trakt_list_details: <<trakt_list>>
        tmdb_collection_details: <<collection>>
        tmdb_movie: <<tmdb_movie>>
        tmdb_list: <<tmdb_list>>
        sort_title: +++_<<collection_name>>
        collection_order: release
        collection_mode: hide
        sync_mode: sync
      IMDb Genre:
        default:
          title: feature
          limit: 100
        imdb_search:
          - url: https://www.imdb.com/search/title/?title_type=<<title>>&release_date=1990-01-01,&user_rating=5.0,10.0&num_votes=100000,&genres=<<genre>>
            limit: <<limit>>
          - url: https://www.imdb.com/search/title/?title_type=<<title>>&release_date=1990-01-01,&user_rating=5.0,10.0&num_votes=100000,&genres=<<genre>>&sort=user_rating,desc
            limit: <<limit>>
        sort_title: +++_<<collection_name>>
        sync_mode: sync
        smart_label: random
        collection_mode: show_items
      Other Genre:
        sort_title: ++_<<collection_name>>
        sync_mode: sync
        smart_label: random
        collection_mode: show_items
      Special Genre:
        sort_title: +_<<collection_name>>
        sync_mode: sync
        smart_label: random
        collection_mode: show_items
      Studio:
        optional:
          - company
        tmdb_company: <<company>>
        sort_title: ++++_<<collection_name>>
        sync_mode: sync
        collection_mode: show_items
      Person:
        smart_filter:
          any:
            actor: tmdb
            director: tmdb
            writer: tmdb
            producer: tmdb
          sort_by: random
          validate: false
        tmdb_person: <<person>>
        sort_title: ~~~~~_<<collection_name>>
        sync_mode: sync
        collection_mode: show_items
    collections:
    #####################################
    #         Studio Collections        #
    #####################################
      Classics:
        plex_search:
          year.gte: 1920
          year.lte: 1959
        sort_title: '###_Classics'
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: classics
        item_radarr_tag: classics
      Pixar:
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        imdb_list: https://www.imdb.com/list/ls087911008/
        template: { name: Studio, company: 3 }
        tmdb_company: 3
        summary: A collection of Pixar movies
        radarr_tag: pixar
        item_radarr_tag: pixar
      DC:
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: dc
        item_radarr_tag: dc
        template: {name: Studio}
        imdb_list: https://www.imdb.com/list/ls077827588/
        summary: "The DC Extended Universe (DCEU) is a media franchise and shared universe centered on superheros from DC Comics."
      Marvel:
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: marvel
        item_radarr_tag: marvel
        template: {name: Studio}
        imdb_list: https://www.imdb.com/list/ls009410711/
        tmdb_company: 420
        summary: "A collection of movies and shows created by Marvel Studios, comprising of the Marvel Cinematic Universe."
      Studio Ghibli:
        tmdb_company: 10342
        template: { name: Studio }
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: studio-ghibli
        item_radarr_tag: studio-ghibli
        summary: Studio Ghibli Inc. is a Japanese animation film studio headquartered in Koganei, Tokyo. The studio is best known for its animated feature films, and has also produced several short films, television commercials, and one television film. The studio’s mascot and most recognizable symbol is the character, Totoro, a giant cat-like spirit from the 1988 classic, My Neighbor Totoro.
      Disney:
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: disney
        item_radarr_tag: disney
        template: { name: Studio }
        # FIXED 2026-09-18: /search/ URLs are rejected by imdb_list since IMDb killed
        # advanced-search scraping; the same query as an imdb_search filter set.
        imdb_search:
          type: movie
          company: co0074039
          limit: 250
        imdb_list: 
          - https://www.imdb.com/list/ls059383351/
          - https://www.imdb.com/list/ls077114097/
        tmdb_company:
        - 6125
    #####################################
    #     General Movies Collections    #
    #####################################
    #  Alien:
    #    template: {name: Movies, collection: 8091}
    #  The Dark Knight:
    #    template: {name: Movies, collection: 263}
    #    sort_title: +++_Dark Knight
    #  Die Hard:
    #    template: {name: Movies, collection: 1570}
    #  Indiana Jones:
    #    template: {name: Movies, collection: 84}
    #  John Wick:
    #    template: {name: Movies, collection: 404609}
    #  Jurassic Park:
    #    template: {name: Movies, collection: 328}
    #  Middle Earth:
    #    template: {name: Movies, collection: "119,121938"}
    #    summary: A collection of movies and shows set in J.R.R. Tolkien's Middle Earth.
    #  Spider-Man:
    #    template: {name: Movies, collection: "556,125574,531241,573436"}
    #    summary: A collection of all the mainstream Spider-Man movies.
    #  Star Wars:
    #    template: {name: Movies, collection: 10}
    #  The Twilight Saga:
    #    template: {name: Movies, collection: 33514}
    #    sort_title: +++_Twilight Saga
    #####################################
    #        Holiday Collections        #
    #####################################
      Valentine's Day Movies:
        schedule: range(02/01-02/14)
        template: {name: Holiday, holiday: "Valentine's Day"}
        imdb_list:
          - https://www.imdb.com/list/ls000094398/
          - https://www.imdb.com/list/ls057783436/
          - https://www.imdb.com/list/ls064427905/
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: valentines-day
        item_radarr_tag: valentines-day
      St. Patrick's Day Movies:
        schedule: range(03/01-03/17)
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: st-patricks-day
        template: {name: Holiday, holiday: "St. Patrick's Day"}
        item_radarr_tag: st-patricks-day
        imdb_list: https://www.imdb.com/list/ls063934595/
      Thanksgiving Movies:
        schedule: range(11/01-11/31)
        sort_title: '!AA'
        radarr_tag: thanksgiving
        item_radarr_tag: thanksgiving
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        summary: A collection of Thanksgiving movies and other movies that may relate to the holiday.
        template: {name: Holiday, holiday: Thanksgiving}
        imdb_list: 
          - https://www.imdb.com/list/ls000835734/
          - https://www.imdb.com/list/ls091597850/
      Halloween Movies:
        schedule: range(10/01-10/31)
        sort_title: '!AB'
        template: {name: Holiday, holiday: Halloween}
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: halloween
        item_radarr_tag: halloween
        imdb_list:
          - https://www.imdb.com/list/ls023118929/
          - https://www.imdb.com/list/ls000099714/
          - https://www.imdb.com/list/ls000058693/
        # FIXED 2026-09-18: was a /search/ URL inside imdb_list (rejected, and would have
        # failed the whole collection when this seasonal one first ran on Oct 1).
        imdb_search:
          type: movie
          genre: horror
          keyword: haunted-house
          limit: 100
        tmdb_collection:
          - 91361    # Halloween Collection
          - 8581     # A Nightmare on Elm Street Collection
          - 1733     # The Mummy Collection
          - 8091     # Alien Collection
        tmdb_movie:
          - 23437    # A Nightmare on Elm Street (2010)
      Christmas Movies:
        schedule: range(12/01-12/31)
        sort_title: '!AB'
        template: {name: Holiday, holiday: Christmas}
        imdb_list: 
          - https://www.imdb.com/list/ls000096828/
          - https://www.imdb.com/list/ls097394442/
          - https://www.imdb.com/list/ls068976997/
          - https://www.imdb.com/list/ls027567380/
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: christmas
        item_radarr_tag: christmas
    #####################################
    #        Popular Collections        #
    #####################################
      Trending Movies:
        sort_title: +++++++_<<collection_name>>
        template: { name: Chart, num: 1 }
        mdblist_list:
          - https://mdblist.com/lists/official/movies/justwatch-streaming-charts
        summary: Movies Trending across the internet
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: trending
        item_radarr_tag: trending
    #####################################
    #        Hallmark                   #
    #####################################
      Hallmark:
        imdb_search:
          type: movie, tv_movie
          company: co0939898
          genre: romance
          limit: 999
        imdb_list:
          - https://www.imdb.com/list/ls025976544/
          - https://www.imdb.com/list/ls003863000/
          - https://www.imdb.com/list/ls027454200/
          - https://www.imdb.com/list/ls027886673/
          - https://www.imdb.com/list/ls097998599/
          - https://www.imdb.com/list/ls066536776/
          - https://www.imdb.com/list/ls041301255/
          - https://www.imdb.com/list/ls510617265/
        mdblist_list:
          - https://mdblist.com/lists/marko8426/hallmark-xmas-movies
          - https://mdblist.com/lists/slimshizn/hallmark-countdown-to-christmas
          - https://mdblist.com/lists/briandnj/hallmark-x-mas
          - https://mdblist.com/lists/kcprophecy/hallmark-christmas-ywa8un60mz
          - https://mdblist.com/lists/setifer/hallmarkchristmasfrom2015
          - https://mdblist.com/lists/vectrexgamer/hallmark-original-christmas-movies
          - https://mdblist.com/lists/vectrexgamer/hallmark-hall-of-fame-christmas-movies
          - https://mdblist.com/lists/mdatum/hallmark
          - https://mdblist.com/lists/SynAcksHM/hallmark
        sort_title: '###Hallmark'
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: hallmark
        item_radarr_tag: hallmark
        imdb_search:
          type: movie
          company: co0939898
          limit: 999
    #####################################
    #        GAC                        #
    #####################################
      GAC:
        sort_title: '###GAC'
        radarr_monitor: true
        radarr_add_missing: true
        radarr_add_existing: true
        collection_order: release.desc
        sync_mode: sync
        radarr_tag: gac
        item_radarr_tag: gac
        imdb_search:
          type: movie
          company: co0814123
          limit: 999
kind: ConfigMap
metadata:
  name: movie-config
  namespace: kometa