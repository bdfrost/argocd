apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      annotations:
        # Roll the pod when the sealed config changes (initContainer re-seeds
        # config.yaml from the secret at startup; without this a reseal merges
        # but the pod keeps running stale config).
        reloader.stakater.com/auto: "true"
      labels:
        app: {{ .Values.name }}
    spec:
      securityContext:
        fsGroup: 1000
      # Seeds /config/config.yaml from the SealedSecret-owned Secret on every
      # start. The entrypoint does `chown -R /config` with `set -e`, so a
      # read-only config mount would kill it; copying through an initContainer
      # keeps the PVC writable and makes the repo authoritative for
      # config.yaml — UI edits persist only until a restart.
      initContainers:
      - name: seed-config
        image: docker.io/library/alpine:3.20
        command:
        - sh
        - -c
        - |
          cp /seed/config.yaml /config/config.yaml
          chown 1000:1000 /config/config.yaml
          chmod 0600 /config/config.yaml
        volumeMounts:
        - name: config-seed
          mountPath: /seed
          readOnly: true
        - name: {{ .Values.name }}-config
          mountPath: /config
      containers:
      - name: {{ .Values.name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.targetPort }}
        env:
        # Kubernetes injects ARR_MCP_PORT=tcp://<clusterIP>:80 from the
        # arr-mcp Service, clobbering the image's ENV default (6060) with
        # a URL and crashing the server (ERR_SOCKET_BAD_PORT, NaN).
        - name: ARR_MCP_PORT
          value: "{{ .Values.targetPort }}"
        - name: TZ
          value: "America/Chicago"
        - name: PGID
          value: "{{ .Values.pgid }}"
        - name: PUID
          value: "{{ .Values.puid }}"
        volumeMounts:
        - name: {{ .Values.name }}-config
          mountPath: /config
      volumes:
        - name: config-seed
          secret:
            secretName: {{ .Values.name }}-config
        - name: {{ .Values.name }}-config
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-config-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: synology-csi-iscsi-delete
  resources:
    requests:
      storage: 2Gi
