# Every PVC on a StorageClass starting with this prefix gets nightly snapshots.
# The sync CronJob finds their namespaces itself, so new apps need no edits here.
storageClassPrefix: synology-csi-iscsi
snapshotClassName: synology-csi-delete
# snapscheduler runs in UTC: 08:30 UTC is 02:30 CST / 03:30 CDT, clear of the
# 01:00 backup window.
schedule: "30 8 * * *"
maxCount: 7
# The audit fails the sync job (and so fires KubeJobFailed) when a PVC's newest
# ready snapshot is older than this. Namespaces whose schedule is younger than
# this are skipped until their first snapshot has had time to run.
maxSnapshotAgeHours: 36
image:
  repository: alpine/k8s
  # renovate: datasource=docker depName=alpine/k8s
  tag: 1.37.2
  pullPolicy: IfNotPresent
