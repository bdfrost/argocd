apiVersion: v1
kind: ConfigMap
metadata:
  name: snapshotschedule
data:
  snapshotschedule.yaml: |
    apiVersion: snapscheduler.backube/v1
    kind: SnapshotSchedule
    metadata:
      name: nightly
      labels:
        app.kubernetes.io/managed-by: volume-snapshots-sync
    spec:
      claimSelector: {}
      schedule: {{ .Values.schedule | quote }}
      retention:
        maxCount: {{ .Values.maxCount }}
      snapshotTemplate:
        snapshotClassName: {{ .Values.snapshotClassName }}
