replicaCount: 1
name: uptime-kuma
targetPort: 3001
puid: 1026
pgid: 100
uptime-kuma:
  image:
    repository: louislam/uptime-kuma
    tag: "2.5.3"
    pullPolicy: IfNotPresent
  # Uptime Kuma v2 performs an in-place migration of the existing SQLite
  # database. Recreate is intentional: it prevents two pods from competing
  # for the RWO data volume during the migration.
  strategy:
    type: Recreate
  service:
    type: ClusterIP
    port: 443
  ingress:
    className: nginx
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/host: uptime-kuma.frost.haus
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/server-snippets: |
        location / {
          proxy_set_header Upgrade $http_upgrade;
          proxy_http_version 1.1;
          proxy_set_header X-Forwarded-Host $http_host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header Host $host;
          proxy_set_header Connection "upgrade";
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_cache_bypass $http_upgrade;
        }
    tls:
    - secretName: uptime-kuma-cert
      hosts:
        - uptime-kuma.frost.haus
    hosts:
    - host: uptime-kuma.frost.haus
      paths:
        - path: /
          pathType: ImplementationSpecific
  serviceMonitor:
    enabled: true
  volume:
    enabled: true
    accessMode: ReadWriteOnce
    size: 4Gi
    # If you want to use a storage class other than the default, uncomment this
    # line and define the storage class name
    # storageClassName:
    # Reuse your own pre-existing PVC.
    existingClaim: "uptime-kuma-config-pvc"