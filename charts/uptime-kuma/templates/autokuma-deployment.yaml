apiVersion: apps/v1
kind: Deployment
metadata:
  name: autokuma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: autokuma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autokuma
    spec:
      containers:
        - name: autokuma
          image: ghcr.io/bigboot/autokuma:2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: AUTOKUMA__KUMA__URL
              value: http://uptime-kuma:443
            - name: AUTOKUMA__KUMA__USERNAME
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-management
                  key: username
            - name: AUTOKUMA__KUMA__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uptime-kuma-management
                  key: password
            - name: AUTOKUMA__STATIC_MONITORS
              value: /static_monitors
            - name: AUTOKUMA__FILES__ENABLED
              value: "true"
            # ConfigMap volumes expose files through symlinks into ..data.
            - name: AUTOKUMA__FILES__FOLLOW_SYMLINKS
              value: "true"
            - name: AUTOKUMA__KUBERNETES__ENABLED
              value: "false"
            - name: AUTOKUMA__DOCKER__ENABLED
              value: "false"
            - name: AUTOKUMA__TAG_NAME
              value: AutoKuma
            - name: AUTOKUMA__TAG_COLOR
              value: "#42C0FB"
            - name: AUTOKUMA__ON_DELETE
              value: delete
            # Keep at info: trace/debug print static monitor files, including the
            # Slack webhook from slack.json, into the pod log (and on into Loki).
            - name: RUST_LOG
              value: autokuma=info,kuma_client=info
          volumeMounts:
            - name: static-monitors
              mountPath: /static_monitors
              readOnly: true
            # AutoKuma >= 1.0 records which monitors it created in /data. Without
            # persistence every restart forgot them and created a full duplicate set.
            - name: data
              mountPath: /data
      volumes:
        # Monitors come from the ConfigMap; the Slack notification comes from a
        # SealedSecret because its webhook URL can't be committed in plaintext.
        - name: static-monitors
          projected:
            sources:
              - configMap:
                  name: autokuma-static-monitors
              - secret:
                  name: autokuma-slack-notification
        - name: data
          persistentVolumeClaim:
            claimName: autokuma-data-pvc
