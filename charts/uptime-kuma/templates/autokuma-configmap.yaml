apiVersion: v1
kind: ConfigMap
metadata:
  name: autokuma-static-monitors
data:
  # One key per monitor: AutoKuma uses the file name (without .json) as the monitor's id,
  # so monitors can be added, removed or reordered freely. Removing a key deletes that
  # monitor in Kuma (AUTOKUMA__ON_DELETE=delete).
  # Every monitor alerts through the "slack" notification, defined in slack.json from the
  # autokuma-slack-notification SealedSecret (the webhook URL can't live in this public repo).
  # AutoKuma 2.0.0 doesn't apply notification_names, so slack.json also sets applyExisting,
  # which makes Kuma link the notification to every monitor whenever AutoKuma saves it.
  homepage.json: |-
    {
      "name": "Homepage",
      "type": "http",
      "url": "https://homepage.frost.haus",
      "interval": 60,
      "max_retries": 2,
      "accepted_statuscodes": [
        "200-299"
      ],
      "notification_names": [
        "slack"
      ]
    }
