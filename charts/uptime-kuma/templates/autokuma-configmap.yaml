        "name": "Homepage",
        "type": "http",
        "url": "https://homepage.frost.haus",
        "interval": 60,
        "max_retries": 2,
        "accepted_statuscodes": [
          "200-299"
        ],
        "notification_names": [
          "slack"
        ]
      },
      {
        "name": "Argo CD",
