apiVersion: v1
kind: ConfigMap
metadata:
  name: autokuma-static-monitors
data:
  # Every monitor alerts through the "slack" notification, defined in slack.json from the
  # autokuma-slack-notification SealedSecret (the webhook URL can't live in this public repo).
  # Keep the null tombstone at its array index: AutoKuma keys these monitors by index, so removing it shifts later monitor identities.
