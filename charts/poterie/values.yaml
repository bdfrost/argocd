# frost.haus deployment values for the wrapped OCI poterie chart.
# Chart source of truth: github.com/bdfrost/poterie (charts/poterie).
poterie:
  image:
    repository: ghcr.io/bdfrost/poterie
    # renovate: datasource=docker depName=ghcr.io/bdfrost/poterie
    tag: "1.4.2"
    pullPolicy: IfNotPresent

  # Admin basic-auth credentials — provided by the SealedSecret in
  # templates/sealedsecret.yaml (keys: ADMIN_USER, ADMIN_PASS).
  admin:
    existingSecret: poterie-admin

  persistence:
    enabled: true
    # Fresh chart-managed PVC (poterie-data). The legacy poterie-data-pvc-synology
    # PVC was pruned by Argo after the OCI wrapper migration; data reset accepted,
    # the app reseeds the 58-flower catalog on startup.
    storageClass: synology-csi-iscsi-delete
    size: 2Gi

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      external-dns.alpha.kubernetes.io/host: poterie.frost.haus
    hosts:
      - host: poterie.frost.haus
        paths:
          - path: /
            pathType: ImplementationSpecific
      - host: poterie.app
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - secretName: poterie-cert
        hosts:
          - poterie.frost.haus
          - poterie.app

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
